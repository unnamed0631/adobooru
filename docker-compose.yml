name: ${COMPOSE_PROJECT_NAME:-adobooru}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ------------------------------------------------------------------------
  # Oxibooru core
  # ------------------------------------------------------------------------
  sql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-szurubooru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-szurubooru}
    volumes:
      - ./sql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  server:
    image: oxibooru/server:0.9.0
    restart: unless-stopped
    depends_on:
      sql:
        condition: service_healthy
    environment:
      POSTGRES_HOST: sql
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-szurubooru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-szurubooru}
      PORT: "6666"
    volumes:
      - ./data:/data
      - ./config/config.toml:/opt/app/config.toml:ro
    ports:
      # API is loopback-only; the client's nginx is the public surface.
      - "127.0.0.1:${OXI_API_PORT:-6666}:6666"
    stop_signal: SIGINT
    stop_grace_period: 30s
    logging: *default-logging

  client:
    image: oxibooru/client:0.9.0
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      BACKEND_HOST: server
      BASE_URL: ${OXI_BASE_URL:-/}
    volumes:
      - ./data:/data:ro
    ports:
      - "${OXI_WEB_PORT:-8082}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null 'http://127.0.0.1/api/posts/?limit=1' || exit 1"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  # Oxibooru has no Redis backend. It backs the orchestrator's cross-replica
  # job locks and keeps the stack ready for additional workers.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # ------------------------------------------------------------------------
  # Ingestion scheduler + orchestration API
  # ------------------------------------------------------------------------
  orchestrator:
    build:
      context: ./orchestrator
      args:
        WITH_PLAYWRIGHT: ${WITH_PLAYWRIGHT:-false}
    image: adobooru/orchestrator:latest
    restart: unless-stopped
    depends_on:
      client:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Container-internal endpoints override whatever is in .env so the same
      # file keeps working for host-side CLI runs.
      ADOBORU_DATA_DIR: /var/lib/adobooru
      SZURU_API_URL: http://client
      SZURU_CONTENT_BASE_URL: http://client/
      TAGGING_POLICY: /etc/adobooru/tagging.yaml
      TWITTER_COOKIES: /secrets/cookies.txt
      REDIS_URL: redis://redis:6379/0
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: "8081"
      # glibc otherwise creates up to 8 malloc arenas per core and keeps freed
      # buffers in each thread's arena; with 28 threads that stranded hundreds
      # of MB in swap.  Two shared arenas is plenty for this workload.
      MALLOC_ARENA_MAX: "2"
    volumes:
      - orchestrator-data:/var/lib/adobooru
      - ./config/tagging.yaml:/etc/adobooru/tagging.yaml:ro
      - ./secrets:/secrets:ro
    ports:
      # Bound to loopback on purpose; put it behind your reverse proxy if the
      # API should be reachable remotely, and set ORCHESTRATOR_API_KEY.
      - "127.0.0.1:${ORCHESTRATOR_PORT:-8081}:8081"
    command: ["python", "ingest_orchestrator.py", "serve"]
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  redis-data:
  orchestrator-data:
